server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：后端允许单个附件 50MB（backend/app/api/deliverables.py），
    # nginx 默认仅 1MB，若不放开则 1MB 以上的附件全部被 413 拒绝，
    # 后端那条 50MB 校验永远走不到。这里放宽到 60MB 留出 multipart 边界开销。
    # 注意：60m 只是 nginx 侧的传输余量，业务上限 50MB 由后端强校验，两者不是同一件事，
    # 因此下面 413 的提示文案按 50MB 写，不能把 60m 这个内部余量暴露给用户。
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传 / 导出耗时较长，放宽读写超时，避免传输中途被 nginx 掐断
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 超过 client_max_body_size 时返回结构化 JSON，前端可解析出可读提示
    # （与后端统一错误结构 {"error":{"code","message"}} 保持一致）
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        internal;
        default_type application/json;
        return 413 '{"error":{"code":"file_too_large","message":"上传文件过大，单个附件不能超过 50MB"}}';
    }

    # 带 hash 的静态资源：长期缓存（文件名变化即失效）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 禁缓存：发布新版后浏览器立即拿到新 bundle，杜绝"旧版页面"残留
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
