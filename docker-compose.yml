name: project-toolkit

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      # 安全：全站 API 无任何鉴权，只绑定回环地址，禁止暴露到局域网/公网；
      # 远程访问请走 SSH 隧道（见 docs/deployment.md 第六节）。
      - "127.0.0.1:${PT_HTTP_PORT:-8180}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pt:${POSTGRES_PASSWORD}@db:5432/projecttoolkit
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: projecttoolkit
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pt -d projecttoolkit"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 自动备份：脚本在 scripts/backup-loop.sh 里（纯 ASCII，可独立审阅）。
  # 产物落在 ./data/backups/pt_YYYYmmdd_HHMMSS.dump，成功后写日志 "[backup] OK: ..."；
  # 失败则留下 LAST_FAILURE.txt 并每小时重试。
  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGUSER: pt
      PGDATABASE: projecttoolkit
      TZ: Asia/Shanghai
    volumes:
      - ./data/backups:/backups
      - ./data:/data:ro
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    # 与 frontend/backend/db 一致：脚本若因异常（挂载不可写、sleep 参数异常等）退出，
    # 必须被拉起，否则会退化成"容器 Down、没人发现、没有备份"的原始故障形态。
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:

