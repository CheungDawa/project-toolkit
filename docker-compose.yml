name: project-toolkit

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${PT_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://pt:${POSTGRES_PASSWORD}@db:5432/projecttoolkit
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: projecttoolkit
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pt -d projecttoolkit"]
      interval: 5s
      timeout: 3s
      retries: 12

  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "[backup] $(date +'%F %T') 姣忔棩澶囦唤寮€濮?
          pg_dump -h db -U pt -d projecttoolkit -Fc | gzip > /backups/pt_$(date +%Y%m%d_%H%M%S).dump.gz
          find /backups -name 'pt_*.dump.gz' -mtime +14 -delete
          echo "[backup] 瀹屾垚锛岀瓑寰?24 灏忔椂"
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:

